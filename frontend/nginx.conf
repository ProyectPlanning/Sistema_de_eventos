server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Todo lo que empiece por /api se reenvía al backend
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
  }

  # El resto lo atiende React
  location / {
    try_files $uri $uri/ /index.html;
  }
}